name: check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: bun install --frozen-lockfile
      - run: bun run check:version
      - run: bun tools/ops/version.ts check --upstream origin/main
      - run: bun run check:secrets
      - run: bun run --filter '@tsukaima/web' check:i18n
      - run: bun run --filter '@tsukaima/web' lint:i18n
      - run: bun run --filter '@tsukaima/web' build
      - run: bun run check

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            .test-data/e2e/artifacts/
          retention-days: 7
