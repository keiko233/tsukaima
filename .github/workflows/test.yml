name: test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg ripgrep
      - run: bun install --frozen-lockfile
      - run: bun run check:secrets
      - run: bun run --filter '@tsukaima/web' check:i18n
      - run: bun run --filter '@tsukaima/web' lint:i18n
      - run: bun run --filter '@tsukaima/web' build
      - run: bun run check

  e2e:
    runs-on: ubuntu-24.04
    container:
      # Keep this version aligned with Playwright in bun.lock.
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      # This image ships Node.js and npm but lacks the unzip required by setup-bun.
      - run: npm install --global bun@1.4.5
      - run: bun install --frozen-lockfile
      - run: bun run test:e2e
