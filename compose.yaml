services:
  tsukaima:
    image: ${TSUKAIMA_IMAGE:?set TSUKAIMA_IMAGE in the deployment .env}
    container_name: tsukaima
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - ${TSUKAIMA_ROOT:?set TSUKAIMA_ROOT in the deployment .env}/secrets/runtime.env
    environment:
      NODE_ENV: production
      TSUKAIMA_HOST: 0.0.0.0
      TSUKAIMA_PORT: "7420"
      TSUKAIMA_DATA_DIR: /data
      TSUKAIMA_WEB_DIST: /app/apps/web/dist
      TSUKAIMA_VERSION: ${TSUKAIMA_VERSION:?set TSUKAIMA_VERSION in the deployment .env}
      TSUKAIMA_PUBLIC_URL: ${TSUKAIMA_PUBLIC_URL:?set TSUKAIMA_PUBLIC_URL in the deployment .env}
      # `host` is the governed direct executor: allowlisted commands run in worktrees with a
      # scrubbed environment. Switch to `bubblewrap` on a host that can create user namespaces.
      TSUKAIMA_CODING_SANDBOX: ${TSUKAIMA_CODING_SANDBOX:-host}
      TSUKAIMA_TRUSTED_ORIGINS: ${TSUKAIMA_TRUSTED_ORIGINS:-}
      TSUKAIMA_TRUSTED_PROXIES: ${TSUKAIMA_TRUSTED_PROXIES:-172.16.0.0/12}
      # Artifact evidence for self-iteration deployment verification. The patch checksum must be
      # derived from the built image's content (not copied from the proposal), otherwise a
      # restarted deployment stays `manual_apply_required` by design.
      TSUKAIMA_COMMIT: ${TSUKAIMA_COMMIT:-}
      TSUKAIMA_PATCH_SHA256: ${TSUKAIMA_PATCH_SHA256:-}
    ports:
      - "${TSUKAIMA_BIND_ADDR:-127.0.0.1}:7420:7420"
    # Deliberately no `security_opt: seccomp=unconfined`. Docker's default seccomp profile blocks
    # the namespace syscalls bubblewrap needs; the default `host` executor keeps command
    # governance (allowlist, worktree-only cwd, scrubbed env) without relaxing seccomp for the
    # whole runtime. Set TSUKAIMA_CODING_SANDBOX=bubblewrap only on a namespace-capable runtime.
    volumes:
      - ${TSUKAIMA_ROOT:?set TSUKAIMA_ROOT in the deployment .env}/data:/data
    networks:
      - tsukaima
    labels:
      io.tsukaima.managed: "ops/deploy"
      io.tsukaima.version: ${TSUKAIMA_VERSION}
      io.tsukaima.image: ${TSUKAIMA_IMAGE}
      io.tsukaima.commit: ${TSUKAIMA_COMMIT:-unknown}
      io.tsukaima.deployer: ${TSUKAIMA_DEPLOYER:-unknown}

networks:
  tsukaima:
    name: ${TSUKAIMA_DOCKER_NETWORK:-tsukaima}
    external: true
